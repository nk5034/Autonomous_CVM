name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [DEV, QA, UAT, PROD]
      image_tag:
        description: "Image tag (for example, sha-abc123)"
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create workspace virtual environment
        run: python -m venv .venv

      - name: Validate environment
        run: |
          ./.venv/bin/python infrastructure/scripts/promotion_guard.py \
            validate-target \
            --environment "${{ inputs.environment }}"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0

      - name: Set kubeconfig for DEV
        if: ${{ inputs.environment == 'DEV' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config

      - name: Set kubeconfig for QA
        if: ${{ inputs.environment == 'QA' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_QA }}" > ~/.kube/config

      - name: Set kubeconfig for UAT
        if: ${{ inputs.environment == 'UAT' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_UAT }}" > ~/.kube/config

      - name: Set kubeconfig for PROD
        if: ${{ inputs.environment == 'PROD' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config

      - name: Deploy release
        run: |
          chmod +x infrastructure/scripts/deploy.sh
          infrastructure/scripts/deploy.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}"
