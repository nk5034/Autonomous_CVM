name: Promote Environment

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: "Environment to promote from"
        required: true
        type: choice
        options: [DEV, QA, UAT]
      target_environment:
        description: "Environment to promote to"
        required: true
        type: choice
        options: [QA, UAT, PROD]
      image_tag:
        description: "Image tag to promote"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create workspace virtual environment
        run: python -m venv .venv

      - name: Validate promotion transition
        run: |
          ./.venv/bin/python infrastructure/scripts/promotion_guard.py \
            validate-transition \
            --source "${{ inputs.source_environment }}" \
            --target "${{ inputs.target_environment }}"

  deploy-promoted-release:
    needs: validate-promotion
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.target_environment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
