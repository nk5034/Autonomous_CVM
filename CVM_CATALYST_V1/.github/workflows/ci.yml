name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create workspace virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r backend/requirements.txt
          ./.venv/bin/python -m pip install ruff mypy

      - name: Ruff
        run: ./.venv/bin/python -m ruff check backend/src

      - name: Mypy
        continue-on-error: true
        run: ./.venv/bin/python -m mypy backend/src

      - name: Backend unit tests
        env:
          PYTHONPATH: backend
        run: ./.venv/bin/python -m pytest backend/tests/unit -q

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test -- --ci

      - name: Build
        run: npm run build
