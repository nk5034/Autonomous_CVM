apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvm-catalyst-frontend
  labels:
    app.kubernetes.io/name: cvm-catalyst-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cvm-catalyst-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cvm-catalyst-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/REPLACE_ME/cvm-catalyst-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: cvm-catalyst-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
