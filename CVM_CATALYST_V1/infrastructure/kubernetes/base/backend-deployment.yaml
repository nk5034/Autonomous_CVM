apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvm-catalyst-backend
  labels:
    app.kubernetes.io/name: cvm-catalyst-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cvm-catalyst-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cvm-catalyst-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/REPLACE_ME/cvm-catalyst-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cvm-catalyst-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cvm-catalyst-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cvm-catalyst-secrets
                  key: OPENAI_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cvm-catalyst-secrets
                  key: LANGSMITH_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
