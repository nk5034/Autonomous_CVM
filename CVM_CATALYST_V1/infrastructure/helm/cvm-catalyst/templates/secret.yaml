apiVersion: v1
kind: Secret
metadata:
  name: cvm-catalyst-secrets
  namespace: {{ include "cvm-catalyst.namespace" . }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  LANGSMITH_API_KEY: {{ .Values.secrets.LANGSMITH_API_KEY | quote }}
