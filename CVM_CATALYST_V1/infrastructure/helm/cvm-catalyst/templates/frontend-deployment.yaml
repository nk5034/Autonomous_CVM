apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvm-catalyst-frontend
  namespace: {{ include "cvm-catalyst.namespace" . }}
  labels:
    app.kubernetes.io/name: cvm-catalyst-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cvm-catalyst-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cvm-catalyst-frontend
        app.kubernetes.io/environment: {{ .Values.global.environment | quote }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          envFrom:
            - configMapRef:
                name: cvm-catalyst-config
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
