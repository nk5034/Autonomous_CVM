apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvm-catalyst-backend
  namespace: {{ include "cvm-catalyst.namespace" . }}
  labels:
    app.kubernetes.io/name: cvm-catalyst-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cvm-catalyst-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cvm-catalyst-backend
        app.kubernetes.io/environment: {{ .Values.global.environment | quote }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          envFrom:
            - configMapRef:
                name: cvm-catalyst-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cvm-catalyst-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cvm-catalyst-secrets
                  key: OPENAI_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cvm-catalyst-secrets
                  key: LANGSMITH_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
