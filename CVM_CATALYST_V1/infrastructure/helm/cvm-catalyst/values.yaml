global:
  environment: dev
  namespace: cvm-catalyst-dev
  createNamespace: true

images:
  backend:
    repository: ghcr.io/REPLACE_ME/cvm-catalyst-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/REPLACE_ME/cvm-catalyst-frontend
    tag: latest
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  containerPort: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

frontend:
  replicaCount: 1
  containerPort: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

config:
  API_PORT: "8000"
  API_HOST: "0.0.0.0"
  NEXT_PUBLIC_API_URL: "http://cvm-catalyst-backend:8000/api/v1"
  LOG_LEVEL: "INFO"

secrets:
  DATABASE_URL: ""
  OPENAI_API_KEY: ""
  LANGSMITH_API_KEY: ""

ingress:
  enabled: true
  className: nginx
  host: dev.cvm-catalyst.example.com
